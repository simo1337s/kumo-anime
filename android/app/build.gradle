// Kumo for Android (a TV's, mainly). Built by .github/workflows/android.yml,
// which first builds Kumo's server for Android into src/main/jniLibs (see
// README.md here).
plugins {
    id 'com.android.application'
}

def env = { String name, String fallback -> System.getenv(name) ?: fallback }

android {
    namespace 'app.kumo'
    compileSdk 35

    defaultConfig {
        applicationId 'app.kumo'
        minSdk 22
        targetSdk 34
        // 1.0.<number of commits>, like the other releases: the number is
        // the version code.
        versionName env('KUMO_VERSION', '1.0.0')
        versionCode env('KUMO_VERSION_CODE', '1') as int
    }

    signingConfigs {
        release {
            storeFile file(env('KUMO_KEYSTORE', "${rootDir}/../packaging/android/kumo.jks"))
            storePassword env('KUMO_KEYSTORE_PASSWORD', 'kumo-android')
            keyAlias env('KUMO_KEY_ALIAS', 'kumo')
            keyPassword env('KUMO_KEY_PASSWORD', 'kumo-android')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // The server is a program, not a library: Android extracts it
    // (somewhere it may run it) only when it's stored this way.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
