# electron-builder config for the WINDOWS and MACOS releases:
#   - Windows: the installer and the portable zip, built by
#     packaging/windows/build.ps1 and the "Windows release" workflow
#     (.github/workflows/windows.yml), in ../dist/windows/release.
#   - macOS: one universal app for Apple silicon and Intel Macs, as a disk
#     image and a zip (which the app's updates download), built by the
#     "macOS release" workflow (.github/workflows/macos.yml), which puts them
#     in ../dist/macos/release (-c.directories.output).
# The Arch Linux package doesn't use it: packaging/arch/PKGBUILD installs
# main.js, preload.js and package.json for the system electron.
#
# Build the server first: dist/windows/kumo.exe ships as resources\kumo.exe,
# dist/macos/kumo-x64 and kumo-arm64 as Kumo.app/Contents/Resources/kumo
# (merged into one program that runs on both), where main.js looks for it.

appId: app.kumo.desktop # also the AppUserModelID set in main.js
productName: Kumo
# Publisher shown in the exe's details and in Settings > Apps (otherwise the
# exe keeps Electron's "GitHub, Inc.").
extraMetadata:
  author:
    name: Kumo
publish: null # the workflows upload the releases; Kumo updates itself
npmRebuild: false # no native modules

directories:
  output: ../dist/windows/release

files:
  - main.js
  - preload.js
  - icon.png
  - package.json

beforePack: ./check-server.js # fails the build when the server is missing

win:
  icon: icon.png
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  # The portable zip's name (the installer's is set below).
  artifactName: Kumo-${version}-windows-${arch}-portable.${ext}
  extraResources:
    - from: ../dist/windows/kumo.exe
      to: kumo.exe
    # The setup that installs the programs Kumo uses (Scoop, Git, ani-cli,
    # ffmpeg, mpv...): the installer offers to run it (installer.nsh), and
    # kumo.exe has the same script built in for Settings > App > Programs.
    - from: ../server/internal/winsetup/install-tools.ps1
      to: install-tools.ps1

nsis:
  artifactName: Kumo-Setup-${version}-windows-${arch}.${ext}
  oneClick: false
  perMachine: false
  # Always installs for the current user (no admin rights, no "for all
  # users?" page).
  include: ../packaging/windows/installer.nsh
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kumo
  differentialPackage: false # no auto-update, so no .blockmap

mac:
  # macOS app icons leave a margin around the tile (Apple's icon grid).
  icon: ../packaging/macos/icon.png
  category: public.app-category.entertainment
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  artifactName: Kumo-${version}-macos-${arch}.${ext}
  # Packed once for each architecture with its own server (${arch} is x64,
  # then arm64), which the universal app merges into one program.
  extraResources:
    - from: ../dist/macos/kumo-${arch}
      to: kumo
  # Kumo isn't signed with an Apple Developer ID: it's signed ad hoc ("-"),
  # which Apple silicon Macs need to run it at all. The hardened runtime is
  # for notarized apps; with an ad hoc signature it would stop the app from
  # loading its own frameworks.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    # Shown when Kumo first reaches a device on the network (a torrent
    # client, a Chromecast…).
    NSLocalNetworkUsageDescription: Kumo connects to devices on your network, like your torrent client or other computers running Kumo.

dmg:
  # The window: Kumo on the left, the Applications folder on the right.
  title: Kumo ${version}
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
