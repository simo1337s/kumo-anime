# Builds, tests and packages Kumo for Windows on a real Windows machine, then
# publishes the installer and the portable zip as the GitHub Release
# "Kumo <version> for Windows", tagged windows-v<version> on the commit it
# built.
#
# The version is 1.0.<number of commits> (the first two numbers come from
# desktop/package.json): each commit has its own, later commits higher ones.
# Installed copies of Kumo look for the release with the highest version and
# offer it on the Home page (server/internal/update), so the version is also
# built into kumo.exe, with the commit.
#
# Runs on every push to the repository's default branch (except pushes that
# only change docs or the Arch packaging), so Windows copies get every
# change, and by hand from the Actions tab. Running it again on the same
# commit updates that commit's release. Only the newest 10 Windows releases
# are kept: older ones are deleted, tags included.
#
# Windows only: the Arch Linux package is built from source with
# packaging/arch/PKGBUILD and has nothing to do with this workflow, and the
# macOS app has its own (macos.yml).
#
# In the pwsh steps, each program but the last checks $LASTEXITCODE: unlike
# PowerShell's own commands, a failing program (npm, go, gh) doesn't stop the
# script, and GitHub only checks the exit code of the last one.

name: Windows release

on:
  # Pushes to other branches are skipped (see the job's condition).
  push:
    paths-ignore:
      - "**.md"
      - "packaging/arch/**"
      - "packaging/macos/**"
      - "android/**"
      - "packaging/android/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as the GitHub Release windows-v<version> (otherwise it's only kept as workflow artifacts)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build, test and package (Windows x64)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: "0"
    steps:
      # The whole history: the version counts its commits.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          $base = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if (-not ($base -match '^(\d+)\.(\d+)\.')) { throw "desktop/package.json has no version like 1.0.0 (it says '$base')" }
          $count = git rev-list --count HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = "$($Matches[1]).$($Matches[2]).$("$count".Trim())"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=windows-v$version" >> $env:GITHUB_OUTPUT
          "installer=Kumo-Setup-$version-windows-x64.exe" >> $env:GITHUB_OUTPUT
          "portable=Kumo-$version-windows-x64-portable.zip" >> $env:GITHUB_OUTPUT
          "Building Kumo $version for Windows"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      # Same as the Makefile's "embed" target.
      - name: Embed the web UI into the server
        run: |
          $dist = "server/internal/webui/dist"
          Remove-Item -Recurse -Force $dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item -Recurse -Force web/dist/* $dist
          New-Item -ItemType File -Force "$dist/.keep" | Out-Null

      # The stream tests need ffmpeg and skip themselves without it, so a
      # failed install doesn't stop the build. (The ani-cli tests use the Git
      # Bash that the runner already has.)
      - name: Install ffmpeg for the tests
        continue-on-error: true
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -hide_banner -version

      # The setup that installs the programs Kumo uses (Scoop, Git, ani-cli,
      # ffmpeg...) only runs on users' computers, in Windows PowerShell 5.1:
      # check here that it parses there.
      - name: Check the programs setup script
        shell: powershell
        run: |
          $script = "server/internal/winsetup/install-tools.ps1"
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { "::error file=$script,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          "$script parses in Windows PowerShell $($PSVersionTable.PSVersion)"

      - name: go vet
        working-directory: server
        run: go vet ./...

      # A hang fails after 8 minutes with every goroutine's stack, instead of
      # Go's default 10.
      - name: go test
        working-directory: server
        run: go test -count 1 -timeout 8m ./...

      # The version and the commit go into kumo.exe (config.AppVersion and
      # config.Commit): the updater compares them with the newest release's.
      - name: Build kumo.exe
        working-directory: server
        env:
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force ../dist/windows | Out-Null
          $config = "github.com/simo1337s/animetest/server/internal/config"
          go build -trimpath -ldflags "-s -w -X $config.AppVersion=$env:VERSION -X $config.Commit=$env:GITHUB_SHA" -o ../dist/windows/kumo.exe ./cmd/kumo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reported = & ../dist/windows/kumo.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "kumo.exe --version: $reported"
          if ($reported -ne "Kumo $env:VERSION") {
            throw "kumo.exe says '$reported' instead of 'Kumo $env:VERSION': the version didn't make it into the build."
          }

      # electron-builder names the files and versions the app after
      # desktop/package.json: it gets this build's version, on the runner
      # only (nothing is committed).
      - name: Package the desktop app (installer and portable zip)
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm version $env:VERSION --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win --x64 --publish never

      # archive: false uploads the files as they are (no zip around them),
      # named after the file.
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/release/${{ steps.version.outputs.installer }}
          archive: false
          overwrite: true
          if-no-files-found: error

      - name: Upload the portable zip
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/release/${{ steps.version.outputs.portable }}
          archive: false
          overwrite: true
          if-no-files-found: error

      # Creates the release (and its tag, on this commit, when it doesn't
      # exist yet), or updates it: new title and notes, and files of the same
      # name replaced.
      - name: Publish the GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          INSTALLER: ${{ steps.version.outputs.installer }}
          PORTABLE: ${{ steps.version.outputs.portable }}
        run: |
          $repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $title = "Kumo $env:VERSION for Windows"
          $notes = @'
          **Kumo {version} for Windows 10 and 11 (64-bit).** These files are for Windows only: on Arch Linux, build and install Kumo from source with `packaging/arch`, as [the README]({readme}) explains.

          | File | What it is |
          |---|---|
          | `{installer}` | **Installer** (recommended). Installs Kumo for your Windows user, without admin rights, in a folder you can change. Adds Start menu and desktop shortcuts; uninstall it from Settings > Apps. |
          | `{portable}` | **Portable** build. Unzip it anywhere and run `Kumo.exe`; nothing gets installed. Your data is still kept in `%APPDATA%\Kumo`. |

          The files aren't code-signed, so Windows SmartScreen may warn "Windows protected your PC" the first time: click **More info**, then **Run anyway**.

          Kumo finds newer releases by itself: the installed app updates from its Home page (**Update**); for the portable build, download the newest zip.

          Some features use other programs: ffmpeg (needed by the in-app player for most files), mpv, yt-dlp, ani-cli and qBittorrent. What to install for what, and where Kumo keeps its data: [packaging/windows/README.md]({guide}).

          Built from {sha} by [workflow run {run}]({runurl}).
          '@
          $notes = $notes.Replace("{version}", $env:VERSION).Replace("{installer}", $env:INSTALLER).Replace("{portable}", $env:PORTABLE)
          $notes = $notes.Replace("{guide}", "$repo/blob/$env:GITHUB_SHA/packaging/windows/README.md")
          $notes = $notes.Replace("{readme}", "$repo/blob/$env:GITHUB_SHA/README.md#install-arch-linux")
          $notes = $notes.Replace("{sha}", $env:GITHUB_SHA).Replace("{run}", $env:GITHUB_RUN_NUMBER).Replace("{runurl}", "$repo/actions/runs/$env:GITHUB_RUN_ID")
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          $files = @("dist/windows/release/$env:INSTALLER", "dist/windows/release/$env:PORTABLE")

          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            "Updating the release $env:TAG"
            gh release edit $env:TAG --title $title --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $env:TAG @files --clobber
          } else {
            "Creating the release $env:TAG"
            gh release create $env:TAG @files --target $env:GITHUB_SHA --title $title --notes-file $notesFile
          }

      # Every commit can have a release now: keep the newest 10 Windows
      # releases, by version (numbers compared as numbers: 1.0.10 is newer
      # than 1.0.9), and delete the older ones with their tags.
      - name: Delete old releases
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tags = gh release list --limit 1000 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $byVersion = @{ Descending = $true; Expression = { ($_.Substring("windows-v".Length).Split(".") | ForEach-Object { $_.PadLeft(10, "0") }) -join "." } }
          $old = @($tags | Where-Object { $_ -match '^windows-v\d+(\.\d+)*$' } | Sort-Object -Property $byVersion | Select-Object -Skip 10)
          if ($old.Count -eq 0) { "No old releases to delete" }
          foreach ($tag in $old) {
            "Deleting the release $tag and its tag"
            gh release delete $tag --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
