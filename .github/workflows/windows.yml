# Builds, tests and packages Kumo for Windows on a real Windows machine, then
# publishes the installer and the portable zip as the GitHub Release
# "Kumo <version> for Windows", tagged windows-v<version>. The version comes
# from desktop/package.json.
#
# Runs when a windows-v* tag is pushed (e.g. git tag windows-v1.0.0 && git
# push origin windows-v1.0.0), or by hand from the Actions tab.
#
# Windows only: the Arch Linux package is built from source with
# packaging/arch/PKGBUILD and has nothing to do with this workflow.
#
# In the pwsh steps, each program but the last checks $LASTEXITCODE: unlike
# PowerShell's own commands, a failing program (npm, go, gh) doesn't stop the
# script, and GitHub only checks the exit code of the last one.

name: Windows release

on:
  push:
    tags:
      - "windows-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the build as the GitHub Release windows-v<version> (otherwise it's only kept as workflow artifacts)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "desktop/package.json has no version" }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -like "windows-v*" -and $env:GITHUB_REF_NAME -ne "windows-v$version") {
            throw "The tag $env:GITHUB_REF_NAME doesn't match desktop/package.json (version $version): it should be windows-v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=windows-v$version" >> $env:GITHUB_OUTPUT
          "installer=Kumo-Setup-$version-windows-x64.exe" >> $env:GITHUB_OUTPUT
          "portable=Kumo-$version-windows-x64-portable.zip" >> $env:GITHUB_OUTPUT
          "Building Kumo $version for Windows"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      # Same as the Makefile's "embed" target.
      - name: Embed the web UI into the server
        run: |
          $dist = "server/internal/webui/dist"
          Remove-Item -Recurse -Force $dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item -Recurse -Force web/dist/* $dist
          New-Item -ItemType File -Force "$dist/.keep" | Out-Null

      # The stream tests need ffmpeg and skip themselves without it, so a
      # failed install doesn't stop the build. (The ani-cli tests use the Git
      # Bash that the runner already has.)
      - name: Install ffmpeg for the tests
        continue-on-error: true
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -hide_banner -version

      - name: go vet
        working-directory: server
        run: go vet ./...

      # A hang fails after 8 minutes with every goroutine's stack, instead of
      # Go's default 10.
      - name: go test
        working-directory: server
        run: go test -count 1 -timeout 8m ./...

      - name: Build kumo.exe
        working-directory: server
        env:
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force ../dist/windows | Out-Null
          go build -trimpath -ldflags "-s -w" -o ../dist/windows/kumo.exe ./cmd/kumo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reported = & ../dist/windows/kumo.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "kumo.exe --version: $reported"
          if ($reported -notmatch [regex]::Escape($env:VERSION)) {
            "::warning::kumo.exe says '$reported' but desktop/package.json is $env:VERSION: update AppVersion in server/internal/config/config.go too."
          }

      - name: Package the desktop app (installer and portable zip)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win --x64 --publish never

      # archive: false uploads the files as they are (no zip around them),
      # named after the file.
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/release/${{ steps.version.outputs.installer }}
          archive: false
          overwrite: true
          if-no-files-found: error

      - name: Upload the portable zip
        uses: actions/upload-artifact@v7
        with:
          path: dist/windows/release/${{ steps.version.outputs.portable }}
          archive: false
          overwrite: true
          if-no-files-found: error

      # Creates the release (and its tag, on this commit, when it doesn't
      # exist yet), or updates it: new title and notes, and files of the same
      # name replaced.
      - name: Publish the GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          INSTALLER: ${{ steps.version.outputs.installer }}
          PORTABLE: ${{ steps.version.outputs.portable }}
        run: |
          $repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $title = "Kumo $env:VERSION for Windows"
          $notes = @'
          **Kumo {version} for Windows 10 and 11 (64-bit).** These files are for Windows only: on Arch Linux, build and install Kumo from source with `packaging/arch`, as [the README]({readme}) explains.

          | File | What it is |
          |---|---|
          | `{installer}` | **Installer** (recommended). Installs Kumo for your Windows user, without admin rights, in a folder you can change. Adds Start menu and desktop shortcuts; uninstall it from Settings > Apps. |
          | `{portable}` | **Portable** build. Unzip it anywhere and run `Kumo.exe`; nothing gets installed. Your data is still kept in `%APPDATA%\Kumo`. |

          The files aren't code-signed, so Windows SmartScreen may warn "Windows protected your PC" the first time: click **More info**, then **Run anyway**.

          Some features use other programs: ffmpeg (needed by the in-app player for most files), mpv, yt-dlp, ani-cli and qBittorrent. What to install for what, and where Kumo keeps its data: [packaging/windows/README.md]({guide}).

          Built from {sha} by [workflow run {run}]({runurl}).
          '@
          $notes = $notes.Replace("{version}", $env:VERSION).Replace("{installer}", $env:INSTALLER).Replace("{portable}", $env:PORTABLE)
          $notes = $notes.Replace("{guide}", "$repo/blob/$env:GITHUB_SHA/packaging/windows/README.md")
          $notes = $notes.Replace("{readme}", "$repo/blob/$env:GITHUB_SHA/README.md#install-arch-linux")
          $notes = $notes.Replace("{sha}", $env:GITHUB_SHA).Replace("{run}", $env:GITHUB_RUN_NUMBER).Replace("{runurl}", "$repo/actions/runs/$env:GITHUB_RUN_ID")
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          $files = @("dist/windows/release/$env:INSTALLER", "dist/windows/release/$env:PORTABLE")

          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            "Updating the release $env:TAG"
            gh release edit $env:TAG --title $title --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $env:TAG @files --clobber
          } else {
            "Creating the release $env:TAG"
            gh release create $env:TAG @files --target $env:GITHUB_SHA --title $title --notes-file $notesFile
          }
